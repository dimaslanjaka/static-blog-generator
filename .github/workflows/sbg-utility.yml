name: Build Utility

# reference: https://github.com/dimaslanjaka/nodejs-package-types/blob/main/.github/workflows/build-release.yml

on:
  push:
    branches: ['sbg-utility']
    paths:
      - '**/src/**'
      - '**/sbg-utility.yml'
      - '**/package-lock.json'
      - '**/package.json'
      - '**/yarn.lock'
      - '**/gulpfile*'
  workflow_dispatch:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

concurrency:
  group: build-sbg-utility
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: '--max_old_space_size=8192'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      node-version: 20.x
      YARN_CHECKSUM_BEHAVIOR: update
      CACHE_PATHS: |
        **/.cache
        **/.yarn
        **/release*
        **/tmp
        **/dist
        ~/.npm
        ~/.cache/yarn
        packages/**/node_modules

    steps:
      - name: ⬇️ Checkout Repository (sbg-utility)
        uses: actions/checkout@v4
        with:
          repository: dimaslanjaka/static-blog-generator
          ref: sbg-utility
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: ⚙️ Initialize Environment Variables
        id: set-env
        shell: bash
        run: |
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/vendor/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/venv/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

          echo "GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-6)" >> $GITHUB_ENV
          echo "GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-6)" >> $GITHUB_OUTPUT

          echo "GITHUB_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "GITHUB_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

          echo "GITHUB_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}" >> $GITHUB_ENV
          echo "GITHUB_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}" >> $GITHUB_OUTPUT

          echo "GITHUB_RUNNER_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "GITHUB_RUNNER_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

          echo "CACHE_NPM=$(npm config get cache)" >> $GITHUB_ENV
          echo "CACHE_NPM=$(npm config get cache)" >> $GITHUB_OUTPUT

          YARN_CURRENT=$(yarn -v)
          YARN_BERRY=3.2.1

          if [[ "ok" == "$(echo | awk "(${YARN_CURRENT} > ${YARN_BERRY}) { print \"ok\"; }")" ]]; then
            echo "CACHE_YARN=$(yarn config get cacheFolder)" >> $GITHUB_ENV
            echo "CACHE_YARN=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
          else
            echo "CACHE_YARN=$(yarn cache dir)" >> $GITHUB_ENV
            echo "CACHE_YARN=$(yarn cache dir)" >> $GITHUB_OUTPUT
          fi

          echo "architecture=$(getconf LONG_BIT)" >> $GITHUB_ENV

          if [ -f "package-lock.json" ]; then
            echo "PACKAGE-MANAGER=npm" >> $GITHUB_OUTPUT
            echo "PACKAGE-MANAGER=npm" >> $GITHUB_ENV
          else
            echo "PACKAGE-MANAGER=yarn" >> $GITHUB_OUTPUT
            echo "PACKAGE-MANAGER=yarn" >> $GITHUB_ENV
          fi

          unameOut="$(uname -s)"

          case "${unameOut}" in
            Linux*) machine=linux ;;
            Darwin*) machine=mac ;;
            CYGWIN*) machine=cygwin ;;
            MINGW*) machine=mingw ;;
            *) machine="unknown:${unameOut}" ;;
          esac

          echo "machine=$machine" >> $GITHUB_OUTPUT
          echo "machine=$machine" >> $GITHUB_ENV

      - name: 🧹 Set Git Line Endings (EOL)
        continue-on-error: true
        run: |
          git config core.eol lf
          git config core.autocrlf input
          git checkout-index --force --all

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Enable Corepack for Yarn
        run: corepack enable

      - name: 📦 Restore Build Cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ runner.os }}-${{ github.ref_name }}-${{ env.node-version }}-${{ hashFiles('**/*.ts', '**/*.js', '**/*.cjs', '**/*.mjs', '**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.ref_name }}-${{ env.node-version }}-
            ${{ runner.os }}-${{ env.node-version }}-
            ${{ runner.os }}-

      - name: 🌍 Install Global Dev Dependencies
        run: npm i -g typescript ts-node gulp-cli

      - name: 🔧 Set Yarn configuration
        working-directory: packages/sbg-utility
        run: |
          YARN_CURRENT=$(yarn -v)
          YARN_BERRY=3.2.1

          if [[ "ok" == "$(echo | awk "(${YARN_CURRENT} > ${YARN_BERRY}) { print \"ok\"; }")" ]]; then
            yarn config set enableImmutableInstalls false
            yarn config set enableInlineBuilds true
            yarn config set enableScripts true
            yarn config set nodeLinker node-modules
            yarn set version 4.9.2
            yarn config set cacheFolder "${GITHUB_WORKSPACE}/packages/sbg-utility/.yarn/caches"
          fi

      - name: 📥 Install Dependencies (sbg-utility)
        working-directory: packages/sbg-utility
        run: |
          [ -f yarn.lock ] || touch yarn.lock
          yarn install

      - name: 🧽 Clean Previous Builds
        working-directory: packages/sbg-utility
        run: yarn run clean

      - name: 🏗️ Build Project
        working-directory: packages/sbg-utility
        run: yarn run build

      - name: 📦 Package Build Artifacts
        working-directory: packages/sbg-utility
        run: yarn run pack

      - name: 📚 Generate Documentation
        working-directory: packages/sbg-utility
        run: yarn run docs

      - name: ➕ Git Add Changes
        working-directory: packages/sbg-utility
        run: git add release docs

      - name: 📤 Commit and Push Changes (only sbg-utility)
        working-directory: packages/sbg-utility
        run: |
          git config --global user.email "dimaslanjaka@gmail.com"
          git config --global user.name "dimaslanjaka"
          if [ $(git status --porcelain -- release | wc -l) -gt "0" ]; then
            git commit \
              -m "build(release): update generated release artifacts" \
              -m "source commit: ${{ env.GITHUB_SHA_SHORT }}" \
              -m "source url: ${{ env.GITHUB_COMMIT_URL }}" \
              -m "workflow run: ${{ env.GITHUB_RUNNER_URL }}"

            git push
          fi

      - name: 💾 Save Build Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
