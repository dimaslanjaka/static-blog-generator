name: Clean Caches

on:
  push:
    branches: ['master', 'beta']
    paths:
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/_config.yml'
      - '**/package.json'
  workflow_dispatch:

# run single job
concurrency:
  group: clean-caches
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest

    name: Cache Cleaner
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🚀 Enable Corepack for Yarn
        run: corepack enable

      # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#force-deletion-of-caches-overriding-default-cache-eviction-policy
      - name: 🧹 Clean Caches
        shell: bash
        run: |
          yarn dlx binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz clean-github-actions-caches
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
